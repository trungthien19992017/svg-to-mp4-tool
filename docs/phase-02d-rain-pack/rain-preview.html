<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phase 02D · Rain Preview</title><style>body{margin:0;background:#202831;color:#fff;font:14px system-ui;display:flex;align-items:center;justify-content:center;gap:20px;min-height:100vh;flex-wrap:wrap}main{position:relative;width:min(55vh,92vw);aspect-ratio:9/16;overflow:hidden;border-radius:12px;box-shadow:0 12px 50px #0008}main img{position:absolute;inset:0;width:100%;height:100%}.rain{pointer-events:none}.move{animation:rainmove 12s linear infinite}.move.slow{animation-duration:18s}.move.fast{animation-duration:9s}@keyframes rainmove{0%{transform:translateY(-8px)}100%{transform:translateY(20px)}}aside{max-width:280px;padding:18px}button{padding:10px 16px;border:0;border-radius:8px;cursor:pointer}label{display:block;margin:12px 0}small{opacity:.75}</style></head><body><main><img src="master-background.png" alt="Approved master room"><img class="rain move" id="back" src="rain-back.svg"><img class="rain" id="glass" src="rain-glass.svg"><img class="rain" id="reflect" src="window-reflections.svg"></main><aside><h2>Rain · Phase 02D</h2><label><input type="checkbox" id="rainToggle" checked> Bật mưa ngoài cửa sổ</label><label><input type="checkbox" id="glassToggle" checked> Giọt trên kính</label><label><input type="checkbox" id="reflectToggle" checked> Phản chiếu</label><label><input type="checkbox" id="motionToggle" checked> Chuyển động nhẹ</label><small>Visual approval preview only. The CSS movement is illustrative, not a Studio motion library. All geometry is seeded and clipped to the provisional window panes.</small></aside><script>const map=[['rainToggle','back'],['glassToggle','glass'],['reflectToggle','reflect']];for(const [a,b] of map){document.getElementById(a).addEventListener('change',e=>document.getElementById(b).style.display=e.target.checked?'':'none')}document.getElementById('motionToggle').addEventListener('change',e=>document.getElementById('back').classList.toggle('move',e.target.checked));</script></body></html>
