const male=document.getElementById('male'),female=document.getElementById('female'),slider=document.getElementById('time');let turnedView=false;let pose='face',playing=false,last=0;
function mount(host,key,prefix){host.innerHTML=ASSETS[key];const svg=host.firstElementChild;svg.removeAttribute('width');svg.removeAttribute('height');svg.removeAttribute('viewBox');svg.setAttribute('overflow','visible');for(const el of svg.querySelectorAll('[id]')){const old=el.id;el.dataset.originalId=old;el.id=prefix+old}for(const el of svg.querySelectorAll('*'))for(const attr of [...el.attributes])if(attr.value.includes('url(#'))el.setAttribute(attr.name,attr.value.replaceAll('url(#','url(#'+prefix));}
function part(host,id){return host.querySelector('[data-original-id="'+id+'"]')}
function stagePoint(el,x=0,y=0){
 const matrix=document.getElementById('stage').getScreenCTM().inverse().multiply(el.getScreenCTM());
 return new DOMPoint(x,y).matrixTransform(matrix);
}
function rotate(el,angle){el.setAttribute('transform',el.getAttribute('transform').replace(/rotate\([^)]*\)/,'rotate('+angle+')'))}
function aim(host,side,goal,blend){
 const shoulder=part(host,'upper-arm-'+side),elbow=part(host,'forearm-'+side),hand=part(host,'hand-'+side);
 const j=stagePoint(shoulder),e=stagePoint(elbow),w=stagePoint(hand);
 const len1=Math.hypot(e.x-j.x,e.y-j.y),len2=Math.hypot(w.x-e.x,w.y-e.y);
 const dx=goal.x-j.x,dy=goal.y-j.y,d=Math.hypot(dx,dy);
 const direction=Math.atan2(dy,dx),offset=Math.acos(Math.min(1,Math.max(-1,(d*d+len1*len1-len2*len2)/(2*d*len1))));
 const upper=direction+(host===male?offset:-offset);
 const lower=Math.atan2(dy-len1*Math.sin(upper),dx-len1*Math.cos(upper));
 const deg=r=>Math.atan2(Math.sin(r),Math.cos(r))*180/Math.PI;
 const rest=Math.atan2(e.y-j.y,e.x-j.x);
 const handedness=host===female&&turnedView?-1:1;
 rotate(shoulder,handedness*blend*deg(upper-rest));rotate(elbow,handedness*blend*deg(lower-upper));
 return stagePoint(hand);
}
function draw(){
 const t=Number(slider.value),turned=pose!=='front'&&t>=.32;
 turnedView=turned;
 const view=turned?'three-quarter':'front';
 mount(male,'men-'+view,'m-');mount(female,'women-'+view,'w-');
 const configs=[[male,.85,390,232,716.5],[female,.891,788,223,710.5]];
 for(const [host,scale,center,localX,soleY] of configs){
 host.setAttribute('transform','translate('+(center-localX*scale)+' '+(710-soleY*scale)+') scale('+scale+')');
 }
 document.getElementById("palms").replaceChildren();
 let a=stagePoint(part(male,'hand-R')),b=stagePoint(part(female,turned?'hand-R':'hand-L'));
 if(pose==='reach'||pose==='touch'){
 const hold=pose==='touch',fraction=hold?1:Math.max(0,(t-.32)/.68);
 const blend=fraction*fraction*(3-2*fraction),gap=hold?0:22;
 a=aim(male,'R',{x:610-35*.85-gap,y:490},blend);
 b=aim(female,turned?'R':'L',{x:610+32.5*.891+gap,y:490},blend);
 if(blend>.01){
 const layer=document.getElementById('palms');
 for(const [point,r,color] of [[a,35*.85,'#f09f92'],[b,32.5*.891,'#a4dee8']]){
 const palm=document.createElementNS('http://www.w3.org/2000/svg','ellipse');
 for(const [attr,value] of Object.entries({cx:point.x,cy:point.y,rx:r-3,ry:r+5,fill:color,stroke:'#152d3d','stroke-width':6,opacity:blend}))palm.setAttribute(attr,value);
 layer.append(palm);
 }}
 a.x+=35*.85;b.x-=32.5*.891;
 }
 const debug=document.getElementById('debug').checked;document.getElementById('markers').innerHTML=debug?'<line x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'" stroke="#f28298" stroke-dasharray="6 6"/>'+[a,b].map((p,i)=>'<circle cx="'+p.x+'" cy="'+p.y+'" r="5" fill="#0ba8ae"/><text x="'+(p.x+10)+'" y="'+(p.y-10)+'">'+(i?'Nữ':'Nam')+'</text>').join(''):'';document.getElementById('phase').textContent=Math.round(t*100)+'%';for(const b of document.querySelectorAll('[data-pose]'))b.classList.toggle('active',b.dataset.pose===pose)}
for(const b of document.querySelectorAll('[data-pose]'))b.onclick=()=>{pose=b.dataset.pose;slider.value=1;draw()};slider.oninput=draw;document.getElementById('debug').onchange=draw;document.getElementById('reset').onclick=()=>{slider.value=0;draw()};document.getElementById('play').onclick=()=>{playing=!playing;if(playing&&Number(slider.value)>=1)slider.value=0;document.getElementById('play').textContent=playing?'Ⅱ Dừng':'▶ Phát';last=0};function frame(now){if(playing){if(last)slider.value=Math.min(1,Number(slider.value)+(now-last)/2200);draw();if(Number(slider.value)>=1){playing=false;document.getElementById('play').textContent='▶ Phát'}}last=now;requestAnimationFrame(frame)}draw();requestAnimationFrame(frame);</script></html>
